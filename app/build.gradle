plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bipin.clicker'
    compileSdk 34

    defaultConfig {
        applicationId "com.bipin.clicker"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.3"
    }

    // Fixed keystore (app/debug.keystore) taaki har build ka signature same rahe,
    // lekin Release build (debuggable=false) bane taaki Play Protect warning kam aaye.
    signingConfigs {
        if (file('debug.keystore').exists()) {
            debug {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
            release {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (file('debug.keystore').exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            if (file('debug.keystore').exists()) {
                signingConfig signingConfigs.debug
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
}
